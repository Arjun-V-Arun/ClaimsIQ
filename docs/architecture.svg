<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#0e1117"/>
  <style>
    .box{fill:#171b22;stroke:#6ca6ff;stroke-width:2;rx:18}
    .box2{fill:#171b22;stroke:#89d185;stroke-width:2;rx:18}
    .box3{fill:#171b22;stroke:#d6a76b;stroke-width:2;rx:18}
    .title{fill:#f4f4f4;font:700 26px Arial}
    .label{fill:#f4f4f4;font:700 20px Arial}
    .small{fill:#b9c0ca;font:16px Arial}
    .arrow{stroke:#9aa4b2;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <text x="700" y="48" text-anchor="middle" class="title">ClaimsIQ Architecture</text>

  <rect x="535" y="80" width="330" height="78" class="box"/>
  <text x="700" y="113" text-anchor="middle" class="label">Streamlit Dashboard</text>
  <text x="700" y="139" text-anchor="middle" class="small">business analytics + Copilot</text>

  <line x1="700" y1="158" x2="700" y2="205" class="arrow"/>

  <rect x="500" y="205" width="400" height="92" class="box"/>
  <text x="700" y="242" text-anchor="middle" class="label">Groq Function-Calling Agent</text>
  <text x="700" y="269" text-anchor="middle" class="small">tool selection · synthesis · guardrails</text>

  <line x1="580" y1="297" x2="330" y2="385" class="arrow"/>
  <line x1="700" y1="297" x2="700" y2="385" class="arrow"/>
  <line x1="820" y1="297" x2="1070" y2="385" class="arrow"/>

  <rect x="90" y="385" width="480" height="120" class="box2"/>
  <text x="330" y="423" text-anchor="middle" class="label">SQL Analytics Layer</text>
  <text x="330" y="452" text-anchor="middle" class="small">SQLite · indexed/materialised aggregates</text>
  <text x="330" y="478" text-anchor="middle" class="small">KPIs · regional · fuel · age · policy lookup</text>

  <rect x="460" y="385" width="480" height="120" class="box3"/>
  <text x="700" y="423" text-anchor="middle" class="label">ML Review Signals</text>
  <text x="700" y="452" text-anchor="middle" class="small">Isolation Forest · robust preprocessing</text>
  <text x="700" y="478" text-anchor="middle" class="small">cached anomaly scores + diagnostics</text>

  <rect x="830" y="385" width="480" height="120" class="box2"/>
  <text x="1070" y="423" text-anchor="middle" class="label">Hybrid RAG Layer</text>
  <text x="1070" y="452" text-anchor="middle" class="small">Sentence-Transformers · ChromaDB</text>
  <text x="1070" y="478" text-anchor="middle" class="small">semantic + lexical relevance gate</text>

  <line x1="330" y1="505" x2="330" y2="585" class="arrow"/>
  <line x1="700" y1="505" x2="700" y2="585" class="arrow"/>
  <line x1="1070" y1="505" x2="1070" y2="585" class="arrow"/>

  <rect x="90" y="585" width="480" height="100" class="box"/>
  <text x="330" y="624" text-anchor="middle" class="label">Real MTPL2 Data</text>
  <text x="330" y="652" text-anchor="middle" class="small">freMTPL2freq + freMTPL2sev</text>

  <rect x="460" y="585" width="480" height="100" class="box"/>
  <text x="700" y="624" text-anchor="middle" class="label">Evaluation + Testing</text>
  <text x="700" y="652" text-anchor="middle" class="small">pytest · agent benchmark · RAG benchmark · CI</text>

  <rect x="830" y="585" width="480" height="100" class="box"/>
  <text x="1070" y="624" text-anchor="middle" class="label">Policy Corpus</text>
  <text x="1070" y="652" text-anchor="middle" class="small">project-authored demonstration documents</text>
</svg>
